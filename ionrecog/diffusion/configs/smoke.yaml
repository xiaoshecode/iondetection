# CPU pipeline verification only, not a trained scientific model.
data:
  patch_size: 32
  offset: 0.0
  scale: 1000.0
  max_target_frames: 8
model:
  base_channels: 4
diffusion:
  timesteps: 16
  sampling_steps: 4
train:
  steps: 4
  batch_size: 2
  grad_accum: 1
  lr: 0.0002
  seed: 42
  validate_every: 2
  val_batches: 1
  save_every: 2
  ema_decay: 0.9
  precision: fp32
  num_threads: 2
  grad_clip: 1.0
inference:
  tile_size: 64
  overlap: 8
region:
  mode: "off"
detection:
  min_area: 2
  min_distance: 3.0
  radius: 2.0
  threshold_sigma: 4.0
