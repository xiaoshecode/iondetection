data:
  offset: 0.0
  scale: auto
  patch_size: 32
  max_target_frames: 3
model:
  base_channels: 4
train:
  epochs: 1
  steps_per_epoch: 2
  val_steps: 1
  batch_size: 1
  lr: 0.001
  seed: 42
  mask_fraction: 0.05
  num_threads: 2
diffusion:
  schedule: cosine
  timesteps: 20
  sampling_steps: 4
  beta_start: 0.0001
  beta_end: 0.02
