data:
  offset: 0.0
  scale: auto  # CLI fits ONE scale from training maximum; validation/test never refit it.
  patch_size: 64
  max_target_frames: 8
model:
  base_channels: 16
inference:
  tile_size: 256
  overlap: 32
train:
  epochs: 10
  steps_per_epoch: 100
  val_steps: 10
  batch_size: 4
  lr: 0.001
  seed: 42
  mask_fraction: 0.02
  num_threads: 4
diffusion:
  schedule: cosine
  timesteps: 100
  sampling_steps: 20
  beta_start: 0.0001
  beta_end: 0.02
detection:
  sigma: 1.0
  background_sigma: 10.0
  threshold_sigma: 4.0
  min_area: 3
  min_distance: 4.0
  radius: 3.0
  max_ions: 5000
reference:
  bright_ratio: 0.5
  dim_ratio: 0.15
